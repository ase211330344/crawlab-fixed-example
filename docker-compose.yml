services:
  crawlab:
    image: ase211330344/crawlab_fixed:latest
    container_name: crawlab_master
    restart: always
    environment:
      CRAWLAB_NODE_MASTER: "Y"
      CRAWLAB_MONGO_HOST: "mongo"
      CRAWLAB_MONGO_PORT: "27017"
      CRAWLAB_MONGO_DB: "crawlab"
      CRAWLAB_MONGO_USERNAME: "admin"
      CRAWLAB_MONGO_PASSWORD: "admin"
      CRAWLAB_MONGO_AUTHSOURCE: "admin"
      CRAWLAB_SERVER_HOST: "0.0.0.0"
      CRAWLAB_SERVER_PORT: "8000"
      CRAWLAB_GRPC_SERVER_ADDRESS: "0.0.0.0:9666"
      CRAWLAB_GRPC_ADDRESS: "127.0.0.1:9666"
    ports:
      - "5030:8080"
    volumes:
      - ./data/crawlab-metadata:/app/.local
      - ./data/crawlab-root:/root
    depends_on:
      - mongo

  mongo:
    image: mongo:4.2
    container_name: crawlab_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: "admin"
      MONGO_INITDB_ROOT_PASSWORD: "admin"
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongo:/data/db
